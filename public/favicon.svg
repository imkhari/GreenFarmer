<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="50%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <filter id="gf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#052e16" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Green Rounded Container matching header w-9 h-9 rounded-xl bg-hero-gradient -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#gf-grad)" />

  <!-- Crisp White Leaf Icon (Lucide Leaf exactly matching PublicHeader) -->
  <g transform="translate(12, 12) scale(1.6667)" filter="url(#gf-glow)">
    <!-- Filled subtle translucent body for readability at small tab sizes -->
    <path
      d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"
      fill="#FFFFFF"
      fill-opacity="0.22"
    />
    <!-- Outer contour -->
    <path
      d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Stem and center vein -->
    <path
      d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
